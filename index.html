<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SS出張管理</title>
    <!-- 1. 加载 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 2. 加载 Pyodide (Python for WebAssembly) -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
    <style>
        /* 使用 Inter 字体 */
        body { 
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji'; 
        }
        /* 自定义加载中动画 */
        .loader {
            border-top-color: #3498db;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* 激活的标签页样式 */
        .tab-active {
            border-bottom-color: #3b82f6; /* blue-600 */
            color: #3b82f6;
            font-weight: 600;
        }
        /* 非激活的标签页样式 */
        .tab-inactive {
            border-bottom-color: transparent;
            color: #6b7280; /* gray-500 */
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center font-inter p-4">

    <!-- 主内容容器 -->
    <div class="bg-white p-6 md:p-8 rounded-xl shadow-2xl w-full max-w-2xl">
        <h1 class="text-3xl font-bold text-center text-blue-600 mb-6">SS出張管理</h1>

        <!-- (重构) 标签页导航 -->
        <nav class="mb-6 border-b border-gray-200">
            <div class="flex flex-wrap space-x-4">
                <button id="tabApplication" class="tab-active py-3 px-4 border-b-2 text-sm focus:outline-none transition-colors duration-200">
                    出差申请
                </button>
                <button id="tabReport" class="tab-inactive py-3 px-4 border-b-2 text-sm focus:outline-none transition-colors duration-200">
                    出差精算
                </button>
                <button id="tabQuery" class="tab-inactive py-3 px-4 border-b-2 text-sm focus:outline-none transition-colors duration-200">
                    查询记录
                </button>
                <button id="tabTemplates" class="tab-inactive py-3 px-4 border-b-2 text-sm focus:outline-none transition-colors duration-200">
                    模板管理
                </button>
            </div>
        </nav>
        
        <!-- ============================================= -->
        <!-- (重构) 标签页 1: 出差精算 (原 '填写报告') -->
        <!-- ============================================= -->
        <div id="contentReport" class="space-y-6 hidden">
            
            <!-- 步骤 1: 填写主要数据 -->
            <div class="pt-2">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">
                    <span class="text-white bg-gray-600 rounded-full px-2 py-0.5 mr-2">1</span> 
                    填写精算主要数据
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- 出張地 -->
                    <div>
                        <label for="f_destination" class="block text-sm font-medium text-gray-700">出張地</label>
                        <input type="text" id="f_destination" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                    <!-- 概要 -->
                    <div>
                        <label for="f_summary" class="block text-sm font-medium text-gray-700">概要</label>
                        <input type="text" id="f_summary" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                    <!-- 出 发 站 -->
                    <div>
                        <label for="f_dep_station" class="block text-sm font-medium text-gray-700">出 发 站</label>
                        <input type="text" id="f_dep_station" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                    <!-- 返 回 站 -->
                    <div>
                        <label for="f_ret_station" class="block text-sm font-medium text-gray-700">返 回 站</label>
                        <input type="text" id="f_ret_station" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                    <!-- 乘车时间 -->
                    <div>
                        <label for="f_dep_time" class="block text-sm font-medium text-gray-700">乘车时间</label>
                        <input type="time" id="f_dep_time" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                    <!-- 到达时间 -->
                    <div>
                        <label for="f_arr_time" class="block text-sm font-medium text-gray-700">到达时间</label>
                        <input type="time" id="f_arr_time" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                    <!-- 出発日付 -->
                    <div>
                        <label for="f_startDate" class="block text-sm font-medium text-gray-700">出発日付</label>
                        <input type="date" id="f_startDate" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" pattern="\d{4}-\d{2}-\d{2}">
                    </div>
                    <!-- 帰り日付 -->
                    <div>
                        <label for="f_endDate" class="block text-sm font-medium text-gray-700">帰り日付</label>
                        <input type="date" id="f_endDate" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" pattern="\d{4}-\d{2}-\d{2}">
                    </div>
                    <!-- 出張報告 -->
                    <div class="md:col-span-2">
                        <label for="f_report" class="block text-sm font-medium text-gray-700">出張報告</label>
                        <textarea id="f_report" rows="3" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"></textarea>
                    </div>
                </div>
            </div>

            <!-- 步骤 2: 填写费用明细 -->
            <div class="border-t border-gray-200 pt-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-semibold text-gray-800">
                        <span class="text-white bg-indigo-600 rounded-full px-2 py-0.5 mr-2">2</span> 
                        填写费用明细
                    </h3>
                    <button id="addDetailRow" type="button" class="bg-indigo-500 hover:bg-indigo-600 text-white text-sm font-bold py-2 px-3 rounded-lg shadow transition-colors duration-200">
                        + 添加一行
                    </button>
                </div>
                <!-- 明细行容器 -->
                <div id="detailRowsContainer" class="space-y-3 max-h-60 overflow-y-auto pr-2">
                    <!-- 动态内容将在这里添加 -->
                </div>
            </div>

            <!-- 步骤 3: 生成 -->
            <div class="text-center pt-6 border-t border-gray-200">
                <button id="saveAndGenerateButton" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg transition-transform transform hover:scale-105 duration-300 ease-in-out focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 disabled:bg-gray-400 disabled:cursor-not-allowed" disabled>
                    <span id="buttonText">正在加载 Python 环境...</span>
                    <div id="buttonLoader" class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-6 w-6 hidden mx-auto"></div>
                </button>
            </div>
            
            <!-- 状态和下载区域 -->
            <div id="statusArea" class="text-center mt-6 p-4 bg-gray-50 rounded-lg min-h-[80px] flex items-center justify-center flex-col space-y-2">
                <span id="statusMessage" class="text-gray-600">请稍候，正在准备环境...</span>
                <a href="#" id="downloadLink" class="hidden bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded-lg transition-colors duration-300 shadow-md">
                    下载精算文件
                </a>
                <span id="saveStatus" class="hidden text-green-600 text-sm font-medium"></span>
            </div>
        </div>
        
        <!-- ============================================= -->
        <!-- (新) 标签页 2: 出差申请 -->
        <!-- ============================================= -->
        <div id="contentApplication" class="space-y-6">
            <!-- 步骤 1: 填写申请数据 -->
            <div class="pt-2">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">
                    <span class="text-white bg-gray-600 rounded-full px-2 py-0.5 mr-2">1</span> 
                    填写申请数据
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- 出張番号 -->
                    <div>
                        <label for="app_id" class="block text-sm font-medium text-gray-700">出張番号</label>
                        <input type="text" id="app_id" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                    <!-- 出差地区 -->
                    <div>
                        <label for="app_area" class="block text-sm font-medium text-gray-700">出差地区</label>
                        <input type="text" id="app_area" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                    <!-- 出发日期 -->
                    <div>
                        <label for="app_startDate" class="block text-sm font-medium text-gray-700">出发日期</label>
                        <input type="date" id="app_startDate" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" pattern="\d{4}-\d{2}-\d{2}">
                    </div>
                    <!-- 返回日期 -->
                    <div>
                        <label for="app_endDate" class="block text-sm font-medium text-gray-700">返回日期</label>
                        <input type="date" id="app_endDate" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" pattern="\d{4}-\d{2}-\d{2}">
                    </div>
                    <!-- 案件名 -->
                    <div class="md:col-span-2">
                        <label for="app_caseName" class="block text-sm font-medium text-gray-700">案件名</label>
                        <input type="text" id="app_caseName" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                    <!-- 出差目的 -->
                    <div class="md:col-span-2">
                        <label for="app_purpose" class="block text-sm font-medium text-gray-700">出差目的</label>
                        <textarea id="app_purpose" rows="2" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"></textarea>
                    </div>
                    <!-- 预期效果 -->
                    <div class="md:col-span-2">
                        <label for="app_effect" class="block text-sm font-medium text-gray-700">预期效果</label>
                        <textarea id="app_effect" rows="2" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"></textarea>
                    </div>

                    <h4 class="md:col-span-2 text-md font-medium text-gray-700 pt-2 border-t mt-2">预估费用</h4>
                    <!-- 高铁 -->
                    <div>
                        <label for="app_train" class="block text-sm font-medium text-gray-700">高铁</label>
                        <input type="number" id="app_train" value="0" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                    <!-- 飞机 -->
                    <div>
                        <label for="app_plane" class="block text-sm font-medium text-gray-700">飞机</label>
                        <input type="number" id="app_plane" value="0" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                    <!-- 出租车 -->
                    <div>
                        <label for="app_taxi" class="block text-sm font-medium text-gray-700">出租车</label>
                        <input type="number" id="app_taxi" value="0" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                    <!-- 经费 -->
                    <div>
                        <label for="app_others" class="block text-sm font-medium text-gray-700">经费</label>
                        <input type="number" id="app_others" value="0" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                </div>
            </div>

            <!-- 步骤 2: 生成 -->
            <div class="text-center pt-6 border-t border-gray-200">
                <button id="saveAndGenerateApplicationButton" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg transition-transform transform hover:scale-105 duration-300 ease-in-out focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-opacity-50 disabled:bg-gray-400 disabled:cursor-not-allowed" disabled>
                    <span id="appButtonText">保存并生成申请</span>
                    <div id="appButtonLoader" class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-6 w-6 hidden mx-auto"></div>
                </button>
            </div>
            
            <!-- 状态和下载区域 -->
            <div id="appStatusArea" class="text-center mt-6 p-4 bg-gray-50 rounded-lg min-h-[80px] flex items-center justify-center flex-col space-y-2">
                <span id="appStatusMessage" class="text-gray-600">请填写表单 (Pyodide 状态见主页)</span>
                <a href="#" id="appDownloadLink" class="hidden bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded-lg transition-colors duration-300 shadow-md">
                    下载申请文件
                </a>
                <span id="appSaveStatus" class="hidden text-green-600 text-sm font-medium"></span>
            </div>

        </div>

        <!-- ============================================= -->
        <!-- (重构) 标签页 3: 查询记录 -->
        <!-- ============================================= -->
        <div id="contentQuery" class="space-y-6 hidden">
            <h2 class="text-2xl font-semibold text-gray-800">查询已保存记录</h2>

            <!-- 操作按钮 -->
            <div class="flex space-x-4">
                <button id="refreshRecordsButton" class="flex-1 bg-gray-700 hover:bg-gray-800 text-white font-bold py-2 px-4 rounded-lg shadow transition-colors duration-200">
                    刷新列表
                </button>
            </div>
            <!-- (新) CSV 导出按钮 -->
            <div class="flex space-x-4 pt-4 border-t">
                <button id="exportCsvReportButton" class="flex-1 bg-teal-600 hover:bg-teal-700 text-white font-bold py-2 px-4 rounded-lg shadow transition-colors duration-200 text-sm">
                    导出精算记录 (CSV)
                </button>
                <button id="exportCsvApplicationButton" class="flex-1 bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-2 px-4 rounded-lg shadow transition-colors duration-200 text-sm">
                    导出申请记录 (CSV)
                </button>
            </div>


            <!-- 查询状态区域 -->
            <div id="queryStatusArea" class="text-center p-2 text-gray-600"></div>

            <!-- 记录列表容器 -->
            <div id="recordsContainer" class="space-y-3 max-h-96 overflow-y-auto pr-2 border-t border-b border-gray-200 py-4">
                <p class="text-gray-500 text-center">请点击“刷新列表”来加载记录。</p>
            </div>
        </div>

        <!-- ============================================= -->
        <!-- (新) 标签页 4: 模板管理 -->
        <!-- ============================================= -->
        <div id="contentTemplates" class="space-y-6 hidden">
            <h2 class="text-2xl font-semibold text-gray-800">模板管理</h2>
            
            <!-- 模板 1: 出差精算 -->
            <div class="p-4 border rounded-lg">
                <label for="templateFileReport" class="block text-lg font-medium text-gray-700 mb-2">
                    <span class="text-white bg-blue-500 rounded-full px-2 py-0.5 mr-2">1</span> 
                    出差精算模板
                </label>
                <input type="file" id="templateFileReport" accept=".xlsx, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" class="block w-full text-sm text-gray-500
                    file:mr-4 file:py-2 file:px-4
                    file:rounded-lg file:border-0
                    file:text-sm file:font-semibold
                    file:bg-blue-50 file:text-blue-700
                    hover:file:bg-blue-100 transition-colors duration-200 cursor-pointer rounded-lg border border-gray-300">
                <span id="templateReportStatus" class="text-xs text-gray-500 mt-1 block">正在检查缓存...</span>
            </div>

            <!-- 模板 2: 出差申请 -->
            <div class="p-4 border rounded-lg">
                <label for="templateFileApplication" class="block text-lg font-medium text-gray-700 mb-2">
                    <span class="text-white bg-green-500 rounded-full px-2 py-0.5 mr-2">2</span> 
                    出差申请模板
                </label>
                <input type="file" id="templateFileApplication" accept=".xlsx, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" class="block w-full text-sm text-gray-500
                    file:mr-4 file:py-2 file:px-4
                    file:rounded-lg file:border-0
                    file:text-sm file:font-semibold
                    file:bg-green-50 file:text-green-700
                    hover:file:bg-green-100 transition-colors duration-200 cursor-pointer rounded-lg border border-gray-300">
                <span id="templateApplicationStatus" class="text-xs text-gray-500 mt-1 block">正在检查缓存...</span>
            </div>
        </div>

    </div>

    <script type="module">
        // --- DOM 元素引用 (精算) ---
        const saveAndGenerateButton = document.getElementById('saveAndGenerateButton');
        const statusMessage = document.getElementById('statusMessage');
        const downloadLink = document.getElementById('downloadLink');
        const buttonText = document.getElementById('buttonText');
        const buttonLoader = document.getElementById('buttonLoader');
        const addDetailRowButton = document.getElementById('addDetailRow');
        const detailRowsContainer = document.getElementById('detailRowsContainer');
        const saveStatus = document.getElementById('saveStatus');
        
        // --- DOM 元素引用 (申请) ---
        const saveAndGenerateApplicationButton = document.getElementById('saveAndGenerateApplicationButton');
        const appStatusMessage = document.getElementById('appStatusMessage');
        const appDownloadLink = document.getElementById('appDownloadLink');
        const appButtonText = document.getElementById('appButtonText');
        const appButtonLoader = document.getElementById('appButtonLoader');
        const appSaveStatus = document.getElementById('appSaveStatus');

        // --- DOM 元素引用 (模板) ---
        const templateFileInputReport = document.getElementById('templateFileReport');
        const templateFileInputApplication = document.getElementById('templateFileApplication');
        const templateReportStatus = document.getElementById('templateReportStatus');
        const templateApplicationStatus = document.getElementById('templateApplicationStatus');

        // --- DOM 元素引用 (标签页) ---
        const tabReport = document.getElementById('tabReport');
        const tabApplication = document.getElementById('tabApplication');
        const tabQuery = document.getElementById('tabQuery');
        const tabTemplates = document.getElementById('tabTemplates');
        
        const contentReport = document.getElementById('contentReport');
        const contentApplication = document.getElementById('contentApplication');
        const contentQuery = document.getElementById('contentQuery');
        const contentTemplates = document.getElementById('contentTemplates');

        // --- DOM 元素引用 (查询) ---
        const refreshRecordsButton = document.getElementById('refreshRecordsButton');
        const exportCsvReportButton = document.getElementById('exportCsvReportButton');
        const exportCsvApplicationButton = document.getElementById('exportCsvApplicationButton');
        const queryStatusArea = document.getElementById('queryStatusArea');
        const recordsContainer = document.getElementById('recordsContainer');

        // Pyodide 实例 (惰性加载)
        let pyodide = null;

        // --- 应用状态 ---
        let isPyodideReady = false;
        let cachedReportTemplate = null; // (新)
        let cachedApplicationTemplate = null; // (新)

        // --- 状态管理 (主 - 精算) ---
        const STATUS_MESSAGES = {
            loading_pyodide: "正在加载 Python 环境 (Pyodide)...",
            loading_packages: "正在加载 Excel 处理库 (openpyxl, pandas)...",
            ready: "环境准备就绪。请填写表单并点击生成。",
            processing: "正在处理文件... 请稍候...",
            success: "处理完成！",
            error: "发生错误："
        };

        // 更新 UI 状态 (精算表单)
        function setStatus(key, message = '') {
            const fullMessage = STATUS_MESSAGES[key] + message;
            statusMessage.textContent = fullMessage;
            saveStatus.classList.add('hidden'); 

            if (key === 'loading_pyodide' || key === 'loading_packages') {
                saveAndGenerateButton.disabled = true;
                buttonText.textContent = fullMessage;
                buttonLoader.classList.add('hidden');
            } else if (key === 'processing') {
                saveAndGenerateButton.disabled = true;
                buttonText.classList.add('hidden');
                buttonLoader.classList.remove('hidden');
                downloadLink.classList.add('hidden');
                statusMessage.classList.remove('hidden');
            } else if (key === 'ready') {
                saveAndGenerateButton.disabled = false;
                buttonText.textContent = '保存并生成精算';
                buttonText.classList.remove('hidden');
                buttonLoader.classList.add('hidden');
            } else if (key === 'success') {
                saveAndGenerateButton.disabled = false;
                buttonText.textContent = '保存并生成精算';
                buttonText.classList.remove('hidden');
                buttonLoader.classList.add('hidden');
                statusMessage.classList.add('hidden');
                downloadLink.classList.remove('hidden');
                saveStatus.textContent = '精算记录已成功保存!';
                saveStatus.classList.remove('hidden');
            } else if (key === 'error') {
                saveAndGenerateButton.disabled = false;
                buttonText.textContent = '保存并生成精算';
                buttonText.classList.remove('hidden');
                buttonLoader.classList.add('hidden');
                statusMessage.classList.remove('text-gray-600', 'hidden');
                statusMessage.classList.add('text-red-600');
                downloadLink.classList.add('hidden');
            }
            
            if (key !== 'error') {
                statusMessage.classList.remove('text-red-600');
                statusMessage.classList.add('text-gray-600');
            }
        }

        // (新) 更新 UI 状态 (申请表单)
        function setAppStatus(key, message = '') {
            const fullMessage = (STATUS_MESSAGES[key] || key) + message; // 使用主状态或自定义
            appStatusMessage.textContent = fullMessage;
            appSaveStatus.classList.add('hidden');

            if (key === 'processing') {
                saveAndGenerateApplicationButton.disabled = true;
                appButtonText.classList.add('hidden');
                appButtonLoader.classList.remove('hidden');
                appDownloadLink.classList.add('hidden');
                appStatusMessage.classList.remove('hidden');
            } else if (key === 'ready') {
                saveAndGenerateApplicationButton.disabled = false;
                appButtonText.textContent = '保存并生成申请';

        // --- (修改) IndexedDB 帮助函数 ---
        const DB_NAME = 'TemplateDB';
        const DB_VERSION = 3; // (新) 升级版本
        const STORE_NAME_TEMPLATES = 'Templates'; 
        const STORE_NAME_RECORDS = 'Records';
        
        const TEMPLATE_KEY_REPORT = 'userTemplateReportV1'; // (新)
        const TEMPLATE_KEY_APPLICATION = 'userTemplateApplicationV1'; // (新)

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = (e) => reject(`IndexedDB 错误: ${e.target.error}`);
                request.onsuccess = (e) => resolve(e.target.result);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    const oldVersion = e.oldVersion;
                    
                    if (oldVersion < 1) {
                        db.createObjectStore(STORE_NAME_TEMPLATES);
                    }
                    if (oldVersion < 2) {
                        const store = db.createObjectStore(STORE_NAME_RECORDS, { keyPath: 'id' });
                        store.createIndex('startDate', 'startDate', { unique: false });
                        store.createIndex('destination', 'destination', { unique: false });
                    }
                    if (oldVersion < 3) {
                        // (新) 为 'type' 字段添加索引
                        const tx = e.target.transaction;
                        const store = tx.objectStore(STORE_NAME_RECORDS);
                        store.createIndex('type', 'type', { unique: false });
                    }
                };
            });
        }

        // (修改) 保存模板
        async function saveTemplateToDB(key, arrayBuffer) {
            try {
                const db = await openDB();
                const tx = db.transaction(STORE_NAME_TEMPLATES, 'readwrite');
                const store = tx.objectStore(STORE_NAME_TEMPLATES);
                store.put(arrayBuffer, key); // 使用传入的 key
                return new Promise((resolve, reject) => {
                    tx.oncomplete = () => resolve();
                    tx.onerror = (e) => reject(e.target.error);
                });
            } catch (error) {
                console.error('保存模板到 IndexedDB 失败:', error);
            }
        }

        // (修改) 加载模板
        async function loadTemplateFromDB(key) {
            try {
                const db = await openDB();
                const tx = db.transaction(STORE_NAME_TEMPLATES, 'readonly');
                const store = tx.objectStore(STORE_NAME_TEMPLATES);
                const request = store.get(key); // 使用传入的 key
                return new Promise((resolve, reject) => {
                    request.onsuccess = (e) => resolve(e.target.result);
                    request.onerror = (e) => reject(e.target.error);
                });
            } catch (error) {
                console.error('从 IndexedDB 加载模板失败:', error);
                return null;
            }
        }

        // --- 记录的 CRUD 操作 (不变) ---
        
        // (C) 创建记录
        async function saveRecordToDB(record) {
            const db = await openDB();
            const tx = db.transaction(STORE_NAME_RECORDS, 'readwrite');
            const store = tx.objectStore(STORE_NAME_RECORDS);
            store.put(record);
            return new Promise((resolve, reject) => {
                tx.oncomplete = () => resolve();
                tx.onerror = (e) => reject(e.target.error);
            });
        }
        
        // (R) 读取所有记录
        async function loadRecordsFromDB() {
            const db = await openDB();
            const tx = db.transaction(STORE_NAME_RECORDS, 'readonly');
            const store = tx.objectStore(STORE_NAME_RECORDS);
            const request = store.getAll();
            return new Promise((resolve, reject) => {
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        // (R) 读取单条记录
        async function getRecordFromDB(id) {
            const db = await openDB();
            const tx = db.transaction(STORE_NAME_RECORDS, 'readonly');
            const store = tx.objectStore(STORE_NAME_RECORDS);
            const request = store.get(id);
            return new Promise((resolve, reject) => {
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }
        
        // (D) 删除记录
        async function deleteRecordFromDB(id) {
            const db = await openDB();
            const tx = db.transaction(STORE_NAME_RECORDS, 'readwrite');
            const store = tx.objectStore(STORE_NAME_RECORDS);
            store.delete(id);
            return new Promise((resolve, reject) => {
                tx.oncomplete = () => resolve();
                tx.onerror = (e) => reject(e.target.error);
            });
        }

                        '分类': category
                    });

            });

        // --- 5. 辅助函数：运行 Python (精算) ---
        async function generateExcel_Report(latest_data, detail_data) {
            if (!pyodide) throw new Error("Pyodide 尚未加载。");
            if (!cachedReportTemplate) throw new Error("精算模板文件尚未加载。");

            try {
                const templateBytes = new Uint8Array(cachedReportTemplate);
                
                // (注意) 使用特定于精算的变量名
                pyodide.globals.set('report_data_js', latest_data);
                pyodide.globals.set('template_bytes_js', templateBytes);
                pyodide.globals.set('detail_data_js', detail_data);

                let result = await pyodide.runPythonAsync(PYTHON_SCRIPT_REPORT);
                
                let pyError = pyodide.globals.get('error');
                if (pyError) {
                    pyodide.globals.delete('error');
                    throw new Error(pyError);
                }

                const outputBytes = result.toJs(); 
                result.destroy(); 
                
                // 清理全局变量
                pyodide.globals.delete('report_data_js');
                pyodide.globals.delete('template_bytes_js');
                pyodide.globals.delete('detail_data_js');
                pyodide.globals.delete('result');
                
                return outputBytes; // 返回 Uint8Array

            } catch (error) {
                console.error("generateExcel_Report 失败:", error);
                // 确保清理
                pyodide.globals.delete('report_data_js');
                pyodide.globals.delete('template_bytes_js');
                pyodide.globals.delete('detail_data_js');
                pyodide.globals.delete('result');
                pyodide.globals.delete('error');
                throw error;
            }
        }
        
        // --- (新) 5.5 辅助函数：运行 Python (申请) ---
        async function generateExcel_Application(application_data) {
            if (!pyodide) throw new Error("Pyodide 尚未加载。");
            if (!cachedApplicationTemplate) throw new Error("申请模板文件尚未加载。");

            try {
                const templateBytes = new Uint8Array(cachedApplicationTemplate);
                
                // (注意) 使用特定于申请的变量名
                pyodide.globals.set('application_data_js', application_data);
                pyodide.globals.set('template_bytes_js', templateBytes);

                let result = await pyodide.runPythonAsync(PYTHON_SCRIPT_APPLICATION);
                
                let pyError = pyodide.globals.get('error');
                if (pyError) {
                    pyodide.globals.delete('error');
                    throw new Error(pyError);
                }

                const outputBytes = result.toJs(); 
                result.destroy(); 
                
                // 清理全局变量
                pyodide.globals.delete('application_data_js');
                pyodide.globals.delete('template_bytes_js');
                pyodide.globals.delete('result');
                
                return outputBytes; // 返回 Uint8Array

            } catch (error) {
                console.error("generateExcel_Application 失败:", error);
                // 确保清理
                pyodide.globals.delete('application_data_js');
                pyodide.globals.delete('template_bytes_js');
                pyodide.globals.delete('result');
                pyodide.globals.delete('error');
                throw error;
            }
        }

        // --- 6. 辅助函数：创建下载链接 (精算) ---
        function createDownload(bytes, filename) {
            const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            
            if (downloadLink.href.startsWith('blob:')) {
                URL.revokeObjectURL(downloadLink.href);
            }
            
            const url = URL.createObjectURL(blob);
            downloadLink.href = url;
            downloadLink.download = filename;
            return url;
        }

        // --- (新) 6.5 辅助函数：创建下载链接 (申请) ---
        function createAppDownload(bytes, filename) {
            const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            
            if (appDownloadLink.href.startsWith('blob:')) {
                URL.revokeObjectURL(appDownloadLink.href);
            }
            
            const url = URL.createObjectURL(blob);
            appDownloadLink.href = url;
            appDownloadLink.download = filename;
            return url;
        }


        // --- 7. “保存并生成 (精算)” 按钮 ---
        saveAndGenerateButton.addEventListener('click', async () => {
            // 1. 收集和验证数据
            const { latest_data, detail_data, error } = collectReportFormData();
            if (error) {
                setStatus('error', error);
                return;
            }

            setStatus('processing');
            
            try {
                // 2. 生成 Excel
                const outputBytes = await generateExcel_Report(latest_data, detail_data);

                // 3. 创建记录并保存到 DB
                const newRecord = {
                    id: `${Date.now()}-R-${Math.random().toString(36).substring(2, 9)}`,
                    type: 'report', // (新)
                    mainData: latest_data,
                    detailData: detail_data,
                    createdAt: new Date().toISOString(),
                    // 冗余存储以便索引
                    startDate: latest_data['出発日付'],
                    destination: latest_data['出張地']
                };
                await saveRecordToDB(newRecord);

                // 4. 构造文件名
                const startDate = latest_data['出発日付'] ? latest_data['出発日付'].replace(/\//g, '-') : '日期';
                const destination = latest_data['出張地'] ? latest_data['出張地'] : '地点';
                const safeStartDate = startDate.replace(/[^a-zA-Z0-9-]/g, '');
                const safeDestination = destination.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '');
                const newFilename = `${safeStartDate}${safeDestination}出張報告精算書.xlsx`;

                // 5. 创建下载
                createDownload(outputBytes, newFilename);
                
                // 6. 设置成功状态
                setStatus('success');

            } catch (error) {
                console.error("处理失败:", error);
                setStatus('error', `处理失败: ${error.message || error}`);
            }
        });
        
        // --- (新) 7.5 “保存并生成 (申请)” 按钮 ---
        saveAndGenerateApplicationButton.addEventListener('click', async () => {
            // 1. 收集和验证数据
            const { application_data, error } = collectApplicationFormData();
            if (error) {
                setAppStatus('error', error);
                return;
            }

            setAppStatus('processing');
            
            try {
                // 2. 生成 Excel
                const outputBytes = await generateExcel_Application(application_data);

                // 3. 创建记录并保存到 DB
                const newRecord = {
                    id: `${Date.now()}-A-${Math.random().toString(36).substring(2, 9)}`,
                    type: 'application', // (新)
                    mainData: application_data,
                    detailData: [], // 申请表没有明细
                    createdAt: new Date().toISOString(),
                    // 冗余存储以便索引
                    startDate: application_data['出发日期'],
                    destination: application_data['出差地区']
                };
                await saveRecordToDB(newRecord);

                // 4. 构造文件名 (f'{record['出差地区']}出張申請.xlsx')
                const destination = application_data['出差地区'] ? application_data['出差地区'] : '地点';
                const safeDestination = destination.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '');
                const newFilename = `${safeDestination}出張申請.xlsx`;

                // 5. 创建下载
                createAppDownload(outputBytes, newFilename);
                
                // 6. 设置成功状态
                setAppStatus('success');

            } catch (error) {
                console.error("处理失败:", error);
                setAppStatus('error', `处理失败: ${error.message || error}`);
            }
        });


        // --- 8. 标签页切换逻辑 ---
        const tabs = [
            { btn: tabReport, content: contentReport, name: 'report' },
            { btn: tabApplication, content: contentApplication, name: 'application' },
            { btn: tabQuery, content: contentQuery, name: 'query' },
            { btn: tabTemplates, content: contentTemplates, name: 'templates' }
        ];

        function switchTab(targetName) {
            tabs.forEach(tab => {
                if (tab.name === targetName) {
                    tab.btn.classList.replace('tab-inactive', 'tab-active');
                    tab.content.classList.remove('hidden');
                } else {
                    tab.btn.classList.replace('tab-active', 'tab-inactive');
                    tab.content.classList.add('hidden');
                }
            });
            
            // 切换到查询时自动刷新
            if (targetName === 'query') {
                renderRecordsList();
            }
        }
        
        tabReport.addEventListener('click', () => switchTab('report'));
        tabApplication.addEventListener('click', () => switchTab('application'));
        tabQuery.addEventListener('click', () => switchTab('query'));
        tabTemplates.addEventListener('click', () => switchTab('templates'));


        // --- 9. “查询记录” 标签页的逻辑 ---

        // (R) 渲染记录列表
        async function renderRecordsList() {
            queryStatusArea.textContent = '正在加载记录...';
            recordsContainer.innerHTML = '';
            try {
                const records = await loadRecordsFromDB();
                records.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                
                if (records.length === 0) {
                    recordsContainer.innerHTML = '<p class="text-gray-500 text-center">未找到任何已保存的记录。</p>';
                } else {
                    records.forEach(record => {
                        const div = document.createElement('div');
                        div.className = 'record-item flex flex-col md:flex-row justify-between items-start md:items-center p-3 bg-gray-50 rounded-lg border border-gray-200';
                        div.dataset.id = record.id;
                        div.dataset.type = record.type; // (新) 存储类型
                        
                        // (新) 根据类型显示标签
                        const typeTag = record.type === 'application' 
                            ? '<span class="text-xs font-bold text-white bg-green-500 rounded-full px-2 py-0.5 mr-2">申请</span>'
                            : '<span class="text-xs font-bold text-white bg-blue-500 rounded-full px-2 py-0.5 mr-2">精算</span>';

                        div.innerHTML = `
                            <div class="flex-1 mb-2 md:mb-0">
                                <strong class="text-gray-800">${typeTag} ${record.startDate || 'N/A'}</strong>
                                <span class="text-gray-800 mx-2">|</span>
                                <span class="text-gray-700">${record.destination || 'N/A'}</span>
                                <span class="block text-xs text-gray-500 mt-1">
                                    保存于: ${new Date(record.createdAt).toLocaleString()} (ID: ${record.id.substring(0, 14)})
                                </span>
                            </div>
                            <div class="flex space-x-2">
                                <button class="export-record-btn bg-teal-500 hover:bg-teal-600 text-white text-xs font-bold py-1 px-3 rounded-md transition-colors duration-200">
                                    导出 Excel
                                </button>
                                <button class="delete-record-btn bg-red-500 hover:bg-red-600 text-white text-xs font-bold py-1 px-3 rounded-md transition-colors duration-200">
                                    删除
                                </button>
                            </div>
                        `;
                        recordsContainer.appendChild(div);
                    });
                }
                queryStatusArea.textContent = `已加载 ${records.length} 条记录。`;
            } catch (error) {
                console.error('加载记录失败:', error);
                queryStatusArea.textContent = `加载记录失败: ${error.message}`;
                queryStatusArea.classList.add('text-red-600');
            }
        }
        
        refreshRecordsButton.addEventListener('click', renderRecordsList);

        // (修改) 记录列表上的事件委托
        recordsContainer.addEventListener('click', async (e) => {
            const target = e.target;
            const recordItem = target.closest('.record-item');
            if (!recordItem) return;
            
            const id = recordItem.dataset.id;
            const type = recordItem.dataset.type; // (新) 获取类型
            
            // (D) 删除
            if (target.classList.contains('delete-record-btn')) {
                if (!confirm(`您确定要删除这条 [${type}] 记录吗？\n(${id})`)) {
                    return;
                }
                try {
                    queryStatusArea.textContent = `正在删除 ${id}...`;
                    await deleteRecordFromDB(id);
                    await renderRecordsList();
                } catch (error) {
                    queryStatusArea.textContent = `删除失败: ${error.message}`;
                }
            }
            
            // (R) 导出单个 Excel (修改)
            if (target.classList.contains('export-record-btn')) {
                try {
                    queryStatusArea.textContent = `正在为 ${id} 生成 Excel...`;
                    target.disabled = true;
                    target.textContent = '生成中...';

                    const record = await getRecordFromDB(id);
                    if (!record) throw new Error("在数据库中未找到该记录。");
                    
                    let outputBytes;
                    let newFilename;
                    let downloadUrl;

                    // (新) 根据类型调用不同的生成器
                    if (record.type === 'application') {
                        if (!cachedApplicationTemplate) {
                            alert("错误：未找到缓存的 [申请模板]。请前往“模板管理”标签页上传一个。");
                            throw new Error("缺少申请模板");
                        }
                        outputBytes = await generateExcel_Application(record.mainData);
                        const destination = record.mainData['出差地区'] || '地点';
                        newFilename = `${destination}出張申請.xlsx`;
                        // 使用申请表单的下载链接 (虽然是临时的)
                        downloadUrl = createAppDownload(outputBytes, newFilename);

                    } else { // 'report' or default
                        if (!cachedReportTemplate) {
                            alert("错误：未找到缓存的 [精算模板]。请前往“模板管理”标签页上传一个。");
                            throw new Error("缺少精算模板");
                        }
                        outputBytes = await generateExcel_Report(record.mainData, record.detailData);
                        const startDate = record.startDate.replace(/\//g, '-');
                        const destination = record.destination;
                        newFilename = `${startDate}${destination}出張報告精算書.xlsx`;
                        // 使用精算表单的下载链接 (虽然是临时的)
                        downloadUrl = createDownload(outputBytes, newFilename);
                    }
                    
                    // 创建一个临时下载链接并点击
                    const tempLink = document.createElement('a');
                    tempLink.href = downloadUrl;
                    tempLink.download = newFilename;
                    document.body.appendChild(tempLink);
                    tempLink.click();
                    document.body.removeChild(tempLink);
                    
                    queryStatusArea.textContent = `已成功生成 ${id} 的 Excel。`;

                } catch (error) {
                    console.error("导出单个 Excel 失败:", error);
                    queryStatusArea.textContent = `导出 ${id} 失败: ${error.message}`;
                } finally {
                    target.disabled = false;
                    target.textContent = '导出 Excel';
                }
            }
        });

        // --- 10. 导出 CSV ---
        
        // (新) 导出精算 CSV
        function generateReportCsv(records) {
            const headers = [
                'id', 'createdAt', 'startDate', 'destination', 
                'summary', 'report', 'dep_station', 'ret_station',
                'dep_time', 'arr_time', 'detail_count'
            ];
            const rows = records.map(record => {
                const r = record.mainData;
                return [
                    record.id, record.createdAt, r['出発日付'], r['出張地'],
                    r['概要'], r['出張報告'] ? r['出張報告'].replace(/\n/g, ' ') : '', 
                    r['出 发 站'], r['返 回 站'], r['乘车时间'], r['到达时间'],
                    record.detailData ? record.detailData.length : 0
                ];
            });
            return { headers, rows };
        }
        
        // (新) 导出申请 CSV
        function generateApplicationCsv(records) {
            const headers = [
                'id', 'createdAt', 'startDate', 'destination', 
                'caseName', 'purpose', 'effect', 
                'cost_train', 'cost_plane', 'cost_taxi', 'cost_others'
            ];
            const rows = records.map(record => {
                const r = record.mainData;
                return [
                    record.id, record.createdAt, r['出发日期'], r['出差地区'],
                    r['案件名'], 
                    r['出差目的'] ? r['出差目的'].replace(/\n/g, ' ') : '', 
                    r['预期效果'] ? r['预期效果'].replace(/\n/g, ' ') : '',
                    r['高铁'], r['飞机'], r['出租车'], r['经费']
                ];
            });
            return { headers, rows };
        }

        // 辅助函数：将 headers 和 rows 转换为 CSV 字符串
        function formatCsv(headers, rows) {
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += headers.join(",") + "\n";
            rows.forEach(rowArray => {
                const row = rowArray.map(field => 
                    (field === null || field === undefined) ? '' : 
                    (typeof field === 'string' && (field.includes(',') || field.includes('\n'))) ? `"${field.replace(/"/g, '""')}"` : field
                ).join(",");
                csvContent += row + "\n";
            });
            return csvContent;
        }

        // 导出精算
        exportCsvReportButton.addEventListener('click', async () => {
            try {
                queryStatusArea.textContent = '正在生成 [精算] CSV...';
                const allRecords = await loadRecordsFromDB();
                const reportRecords = allRecords.filter(r => r.type === 'report');
                
                if (reportRecords.length === 0) {
                    queryStatusArea.textContent = '没有 [精算] 记录可导出。';
                    return;
                }
                
                const { headers, rows } = generateReportCsv(reportRecords);
                const csvContent = formatCsv(headers, rows);
                
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", "export_reports.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                queryStatusArea.textContent = `已导出 ${reportRecords.length} 条 [精算] 记录。`;
            } catch (error) {
                console.error('导出精算 CSV 失败:', error);
                queryStatusArea.textContent = `导出精算 CSV 失败: ${error.message}`;
            }
        });
        
        // 导出申请
        exportCsvApplicationButton.addEventListener('click', async () => {
            try {
                queryStatusArea.textContent = '正在生成 [申请] CSV...';
                const allRecords = await loadRecordsFromDB();
                const appRecords = allRecords.filter(r => r.type === 'application');

                if (appRecords.length === 0) {
                    queryStatusArea.textContent = '没有 [申请] 记录可导出。';
                    return;
                }
                
                const { headers, rows } = generateApplicationCsv(appRecords);
                const csvContent = formatCsv(headers, rows);

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", "export_applications.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                queryStatusArea.textContent = `已导出 ${appRecords.length} 条 [申请] 记录。`;
            } catch (error) {
                console.error('导出申请 CSV 失败:', error);
                queryStatusArea.textContent = `导出申请 CSV 失败: ${error.message}`;
            }
        });

    </script>
</body>
